services:
  - type: web
    name: interntrack-personal
    runtime: python
    branch: master
    region: virginia
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /healthz
    disk:
      name: interntrack-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: APP_USERNAME
        value: owner
      - key: APP_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_CREDENTIALS_FILE
        value: /etc/secrets/credentials.json
